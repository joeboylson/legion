[package]
name = "legion-app"
version = "0.1.0"
edition = "2021"
description = "The Legion app: one screen for every Legion, talking to legiond."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
legion-client = { path = "../../crates/legion-client" }
legion-proto = { path = "../../crates/legion-proto" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }

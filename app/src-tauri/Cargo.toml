[package]
name = "legion2-app"
version = "0.1.0"
edition = "2021"
description = "The Legion app: one screen for every Legion, talking to legion2d."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
legion2-client = { path = "../../crates/legion2-client" }
legion2-proto = { path = "../../crates/legion2-proto" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }

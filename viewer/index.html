<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <!-- Squad list view -->
      <section id="view-squads" class="section">
        <div class="section-head">
          <span class="label">01 &mdash;</span>
          <div class="stack">
            <h1 class="display">Legion</h1>
            <p class="lead">Squads on this machine. Click one to watch it work.</p>
          </div>
        </div>
        <div id="squad-grid" class="grid"></div>
        <div class="stack" style="margin-top: var(--space-6)">
          <button id="add-squad-btn" class="btn btn--secondary">+ Add squad</button>
        </div>
      </section>

      <!-- Squad grid view -->
      <section id="view-grid" class="section" hidden>
        <div class="section-head">
          <button id="back-btn" class="btn btn--ghost">&larr; Squads</button>
          <div class="stack">
            <h1 id="grid-title" class="display"></h1>
            <p class="lead">Live, interactive panes &mdash; click in and type to talk to an operator directly.</p>
          </div>
        </div>
        <div id="terminal-grid" class="term-grid"></div>
      </section>
    </main>
  </body>
</html>

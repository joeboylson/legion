[package]
name = "legiond"
version = "0.1.0"
edition = "2021"
description = "Legion's background program: runs Claude sessions in terminals it owns."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
legion-proto = { path = "../legion-proto" }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
vt100 = "0.15"

<!doctype html>
<html lang="en" data-mode="workbench">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legion dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="workbench.css">
<style>
  /* No activity bar: the sidebar is the only navigation. */
  .wb {
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
    grid-template-areas:
      "title   title"
      "sidebar main"
      "status  status";
  }
  .wb-main { grid-template-rows: var(--bar) minmax(0, 1fr); }
  .tab .close { padding: 0 var(--space-1); border-radius: var(--radius-sm); color: var(--fg-muted); }
  .tab .close:hover { background: var(--layer-2); color: var(--fg); }
  .channel-view { padding: var(--space-4); display: grid; gap: var(--space-5); }
  .channel-view .label { display: block; margin-bottom: var(--space-2); }
  @media (max-width: 48rem) {
    .wb { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "main" "status"; }
  }
  .wb-titlebar .label { white-space: nowrap; }
  .usage { justify-self: end; display: flex; align-items: center; gap: var(--space-4);
           font-family: var(--font-mono); font-size: var(--text-label); white-space: nowrap; }
  .meter { display: flex; align-items: center; gap: var(--space-2); padding-block: var(--space-2); cursor: default; }
  .meter .bar { display: block; width: var(--space-7); height: var(--space-3); border-radius: var(--radius-sm);
                background: var(--layer-3); overflow: hidden; }
  .meter .fill { display: block; height: 100%; background: var(--fg-muted); }
  .meter.warn .fill { background: var(--warning); }
  .meter.bad .fill { background: var(--danger); }
  .meter.warn .pct { color: var(--warning); }
  .meter.bad .pct { color: var(--danger); }
  .usage .sep { color: var(--fg-muted); }
  /* The page's own tooltip: the browser's hides as soon as text under the
   * pointer is touched, and this page redraws every second. */
  .meter .pct { position: relative; cursor: help; }
  .meter .pct:hover::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + var(--space-2)); right: 0; z-index: 30;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--fg-muted); border-radius: var(--radius-lg);
    background: var(--layer-1); color: var(--fg);
    white-space: nowrap; pointer-events: none;
  }
  .wb-search { cursor: text; padding-inline: var(--space-3); }
  .wb-search input {
    flex: 1; min-width: 0; border: 0; background: none; color: var(--fg);
    font: inherit; outline: none;
  }

  .wb-sidebar .tree { flex: 1; }
  .tree .dot { flex: none; }
  .tree .squad { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--text-label);
                 letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .tree .name { overflow: hidden; text-overflow: ellipsis; }

  .sessions { display: grid; }
  .session { padding: var(--space-4); border-bottom: var(--hairline); min-width: 0; }
  .session-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
  .session-head .addr { font-weight: var(--weight-medium); overflow-wrap: anywhere; }
  .session-head .state { font-family: var(--font-mono); font-size: var(--text-label); color: var(--fg-muted); }
  .session-head .state.working { color: var(--success); }
  .tag.warn { color: var(--warning); border-color: var(--warning); }
  .tag.bad { color: var(--danger); border-color: var(--danger); }
  .tag.dim { border-style: dashed; }

  .session-body { display: grid; gap: var(--space-4); margin-top: var(--space-3); grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 61.6875rem) {
    .session-body.has-screen { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  .session-body > * { min-width: 0; }
  .session-body .label { display: block; margin-bottom: var(--space-2); }

  .calls { width: 100%; table-layout: fixed; }
  .calls td { vertical-align: top; overflow-wrap: anywhere; }
  .calls td:first-child { width: var(--space-8); white-space: nowrap; }
  .calls td:nth-child(2) { width: var(--space-9); }
  .calls td.when, .calls td.tool { color: var(--fg-muted); font-family: var(--font-mono); }
  .calls td.tool { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calls td.what { font-family: var(--font-mono); }
  @media (max-width: 48rem) { .calls td:nth-child(2) { width: var(--space-8); } }

  .screen { margin: 0; padding: var(--space-3); border: var(--hairline); border-radius: var(--radius-md);
            overflow-wrap: anywhere; }

  .events td { vertical-align: top; overflow-wrap: anywhere; font-family: var(--font-mono); }
  .events td.when { width: var(--space-8); white-space: nowrap; color: var(--fg-muted); }
  .events td.squad { width: var(--space-9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-muted); }

  .events tr.bad td.msg { color: var(--danger); }
  .events { table-layout: fixed; }

  .empty { display: grid; gap: var(--space-3); padding: var(--space-5) var(--space-4); color: var(--fg-muted); }
</style>
</head>
<body>
<div class="wb">
  <header class="wb-titlebar">
    <span class="label">Legion dash</span>
    <label class="wb-search">
      <svg class="icon--sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="filter" type="search" placeholder="Filter sessions" autocomplete="off" aria-label="Filter sessions">
    </label>
    <div class="usage" id="usage"></div>
  </header>

  <aside class="wb-sidebar" aria-label="Squads">
    <div class="pane-head"><span class="label">Squads</span><span class="count" id="session-count">0</span></div>
    <ul class="tree" role="tree" id="tree"></ul>
  </aside>

  <main class="wb-main">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="wb-editor" id="editor"></div>
  </main>

  <footer class="wb-status">
    <span id="link"><span class="dot" style="color: var(--fg-muted)"></span>connecting</span>
    <span id="totals"></span>
    <div class="spacer"></div>
    <span class="hide-sm" id="working"></span>
    <span class="hide-sm" id="updated"></span>
    <button type="button" id="channel-btn" title="Open the channel in a tab"><span class="dot" style="color: var(--fg-muted)"></span>Channel <span class="count" id="peer-count">0</span></button>
    <button type="button" id="theme">Theme</button>
  </footer>
</div>

<script>
  // tab: "sessions" or "channel". The channel tab exists once opened from
  // the status bar, until it's closed.
  const view = { focus: null, tab: "sessions", channelOpen: false, filter: "" };
  let last = null;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const ago = (s) => {
    if (s === null || s === undefined) return "";
    s = Math.floor(s);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    return Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
  };
  const clock = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? (iso || "").slice(11, 19) : d.toLocaleTimeString([], { hour12: false });
  };
  const oneLine = (t) => (t || "").split(/\s+/).join(" ");
  const squadOf = (c) => c.squad || c.addr.replace(/-[^-]+$/, "");
  const status = (c) => c.flags.some(([, s]) => s === "bad") ? "var(--danger)"
    : c.flags.some(([, s]) => s === "warn") ? "var(--warning)"
    : c.working ? "var(--success)" : "var(--fg-muted)";
  const stateText = (c) => c.working ? "working" : (c.idle !== null ? "idle " + ago(c.idle) : "idle");

  function visible(s) {
    const f = view.filter.toLowerCase();
    return s.cards.filter((c) => !f || c.addr.toLowerCase().includes(f) || (c.mission || "").toLowerCase().includes(f));
  }

  function tree(s, cards) {
    const out = [];
    const all = el("li");
    const allBtn = el("button");
    allBtn.type = "button";
    allBtn.setAttribute("aria-selected", String(view.tab === "sessions" && view.focus === null));
    allBtn.append(el("span", "name", "All sessions"), el("span", "muted", String(cards.length)));
    allBtn.onclick = () => { view.focus = null; view.tab = "sessions"; render(); };
    all.append(allBtn);
    out.push(all);

    const groups = new Map();
    for (const c of cards) {
      const q = squadOf(c);
      if (!groups.has(q)) groups.set(q, []);
      groups.get(q).push(c);
    }
    for (const [squad, list] of groups) {
      const head = el("li");
      const hb = el("button");
      hb.type = "button";
      hb.setAttribute("aria-selected", String(view.tab === "sessions" && view.focus === "squad:" + squad));
      hb.append(el("span", "squad", squad), el("span", "muted", String(list.length)));
      hb.onclick = () => { view.focus = "squad:" + squad; view.tab = "sessions"; render(); };
      head.append(hb);
      out.push(head);
      for (const c of list) {
        const li = el("li");
        const b = el("button");
        b.type = "button";
        b.style.setProperty("--depth", "1");
        b.setAttribute("aria-selected", String(view.tab === "sessions" && view.focus === c.addr));
        const dot = el("span", "dot");
        dot.style.color = status(c);
        b.append(dot, el("span", "name", c.addr.slice(squad.length + 1) || c.addr), el("span", "muted", c.working ? "" : ago(c.idle)));
        b.title = c.addr + " · " + stateText(c);
        b.onclick = () => { view.focus = c.addr; view.tab = "sessions"; render(); };
        li.append(b);
        out.push(li);
      }
    }
    return out;
  }

  function card(c) {
    const box = el("article", "session");
    const head = el("div", "session-head");
    const dot = el("span", "dot");
    dot.style.color = status(c);
    head.append(dot, el("span", "addr", c.addr), el("span", "state" + (c.working ? " working" : ""), stateText(c)));
    if (c.ctx) head.append(el("span", "tag", "ctx " + c.ctx + "%"));
    if (c.mission) head.append(el("span", "tag", c.mission));
    for (const [text, style] of c.flags) head.append(el("span", "tag " + style, text));
    box.append(head);

    const body = el("div", "session-body" + (c.screen.length ? " has-screen" : ""));
    const acts = el("div");
    acts.append(el("span", "label", "Last tool calls"));
    const t = el("table", "calls");
    const tb = el("tbody");
    if (!c.activity.length) {
      const tr = el("tr");
      const td = el("td", "", "none yet");
      td.colSpan = 3;
      td.className = "muted";
      tr.append(td);
      tb.append(tr);
    }
    for (const e of c.activity) {
      const tr = el("tr");
      const tool = el("td", "tool", e.tool || "");
      tool.title = e.tool || "";
      tr.append(el("td", "when", e.time ? clock(e.time) : ""), tool, el("td", "what", oneLine(e.summary)));
      tb.append(tr);
    }
    t.append(tb);
    acts.append(t);
    body.append(acts);
    if (c.screen.length) {
      const scr = el("div");
      scr.append(el("span", "label", "Screen"));
      scr.append(el("pre", "term screen", c.screen.map((l) => l.trim()).join("\n")));
      body.append(scr);
    }
    box.append(body);
    return box;
  }

  function channelView(s) {
    const box = el("div", "channel-view");
    const peers = el("section");
    peers.append(el("span", "label", "Peers"));
    if (!s.peers.length) peers.append(el("div", "muted", "No squad here has a channel open."));
    else {
      const ul = el("ul", "problems");
      for (const [squad, connected] of s.peers) {
        const li = el("li");
        const dot = el("span", "dot");
        dot.style.color = connected.length ? "var(--success)" : "var(--fg-muted)";
        li.append(dot, el("span", "", squad), el("span", "muted", connected.length ? "connected to " + connected.join(", ") : "not connected to anyone"));
        ul.append(li);
      }
      peers.append(ul);
    }
    const traffic = el("section");
    traffic.append(el("span", "label", "Traffic"));
    if (!s.events.length) traffic.append(el("div", "muted", "No channel traffic yet."));
    else {
      const t = el("table", "events");
      const tb = el("tbody");
      for (const [ts, squad, msg] of s.events.slice().reverse()) {
        const tr = el("tr", /failed|cannot|rejected|dropped|couldn't/.test(msg) ? "bad" : "");
        tr.append(el("td", "when", clock(ts)), el("td", "squad", squad), el("td", "msg", oneLine(msg)));
        tb.append(tr);
      }
      t.append(tb);
      traffic.append(t);
    }
    box.append(peers, traffic);
    return box;
  }

  function render() {
    const s = last;
    if (!s) return;
    const cards = visible(s);
    // Focus is one session's address, "squad:<name>" for a whole squad, or
    // null for everything.
    const focused = (c) => view.focus === null
      || (view.focus.startsWith("squad:") ? squadOf(c) === view.focus.slice(6) : c.addr === view.focus);
    if (view.focus && !s.cards.some(focused)) view.focus = null;
    const shown = cards.filter(focused);

    document.getElementById("tree").replaceChildren(...tree(s, cards));
    document.getElementById("session-count").textContent = s.cards.length;

    const tabs = document.getElementById("tabs");
    const tab = (label, selected, onclick) => {
      const b = el("button", "tab", label);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(selected));
      b.onclick = onclick;
      return b;
    };
    const onSessions = view.tab === "sessions";
    const label = view.focus && view.focus.startsWith("squad:") ? view.focus.slice(6) + " (squad)" : view.focus;
    const list = [tab("All sessions", onSessions && view.focus === null, () => { view.focus = null; view.tab = "sessions"; render(); })];
    if (view.focus) list.push(tab(label, onSessions, () => { view.tab = "sessions"; render(); }));
    if (view.channelOpen) {
      const ch = tab("Channel", !onSessions, () => { view.tab = "channel"; render(); });
      const x = el("span", "close", "×");
      x.title = "Close";
      x.onclick = (e) => { e.stopPropagation(); view.channelOpen = false; view.tab = "sessions"; render(); };
      ch.append(x);
      list.push(ch);
    }
    tabs.replaceChildren(...list);

    const editor = document.getElementById("editor");
    if (!onSessions) {
      editor.replaceChildren(channelView(s));
    } else if (!s.squads.length) {
      editor.replaceChildren(el("div", "empty", "No squads running on this machine."));
    } else if (!shown.length) {
      editor.replaceChildren(el("div", "empty", view.filter ? "No sessions match the filter." : "No sessions running."));
    } else {
      const list = el("div", "sessions");
      list.append(...shown.map(card));
      editor.replaceChildren(list);
    }

    const connected = s.peers.reduce((n, [, c]) => n + c.length, 0);
    document.getElementById("peer-count").textContent = connected;
    document.querySelector("#channel-btn .dot").style.color = connected ? "var(--success)" : "var(--fg-muted)";

    const q = new Set([...s.squads, ...s.cards.map(squadOf)]).size, n = s.cards.length;
    document.getElementById("totals").textContent = `${q} squad${q === 1 ? "" : "s"} · ${n} session${n === 1 ? "" : "s"}`;
    document.getElementById("working").textContent = s.cards.filter((c) => c.working).length + " working";
    document.getElementById("updated").textContent = "updated " + clock(s.time);
    usage(s.usage);
  }

  // The meters are built once and only updated after that: rebuilding them
  // every second would reset their hover tooltips before they ever showed.
  const meters = {};
  function meter(key) {
    if (!meters[key]) {
      const m = el("span", "meter");
      const bar = el("span", "bar");
      const fill = el("span", "fill");
      bar.append(fill);
      const pct = el("span", "pct");
      m.append(bar, pct);
      meters[key] = { m, fill, pct };
    }
    return meters[key];
  }

  function usage(u) {
    const box = document.getElementById("usage");
    if (!u) {
      if (!box.querySelector(".none")) box.replaceChildren(el("span", "muted none", "usage not reported yet"));
      return;
    }
    const age = Date.now() / 1000 - u.as_of;
    const shown = [];
    for (const [key, name, opts] of [["five_hour", "5-hour", { hour: "numeric", minute: "2-digit" }],
                                     ["seven_day", "Weekly", { weekday: "short", hour: "numeric", minute: "2-digit" }]]) {
      const w = u[key];
      if (!w || w.used_percentage === undefined) continue;
      const pct = Math.round(w.used_percentage);
      const { m, fill, pct: label } = meter(key);
      // Touch the DOM only when something changed.
      const cls = "meter" + (pct >= 90 ? " bad" : pct >= 70 ? " warn" : "");
      if (m.className !== cls) m.className = cls;
      if (fill.style.width !== Math.min(100, pct) + "%") fill.style.width = Math.min(100, pct) + "%";
      if (label.textContent !== pct + "%") label.textContent = pct + "%";
      const tip = `${name} usage: ${pct}%`
        + (w.resets_at ? `, resets ${new Date(w.resets_at * 1000).toLocaleString([], opts)}` : "")
        + (age > 600 ? ` (as of ${ago(age)} ago)` : "");
      if (label.dataset.tip !== tip) { label.dataset.tip = tip; label.setAttribute("aria-label", tip); }
      shown.push(m);
    }
    // Only re-place the meters when which ones are shown changes.
    const now = [...box.querySelectorAll(".meter")];
    if (now.length !== shown.length || now.some((n, i) => n !== shown[i])) {
      const parts = [];
      shown.forEach((m, i) => { if (i) parts.push(el("span", "sep", "|")); parts.push(m); });
      box.replaceChildren(...parts);
    }
  }

  function link(ok, text) {
    const l = document.getElementById("link");
    const dot = el("span", "dot");
    dot.style.color = ok ? "var(--success)" : "var(--danger)";
    l.replaceChildren(dot, document.createTextNode(text));
  }

  async function tick() {
    try {
      const r = await fetch("api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      last = await r.json();
      link(true, "live");
      render();
    } catch (e) {
      link(false, "can't reach legion dash");
    }
  }

  document.getElementById("filter").addEventListener("input", (e) => { view.filter = e.target.value; render(); });
  document.getElementById("channel-btn").onclick = () => { view.channelOpen = true; view.tab = "channel"; render(); };
  // http://<host>:7580/#channel opens straight on the channel tab.
  if (location.hash === "#channel") { view.channelOpen = true; view.tab = "channel"; }

  const root = document.documentElement;
  const savedTheme = (() => { try { return localStorage.getItem("legion-dash-theme"); } catch (e) { return null; } })();
  if (savedTheme) root.dataset.theme = savedTheme;
  document.getElementById("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("legion-dash-theme", root.dataset.theme); } catch (e) {}
  };

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
